identity:
  name: json_extractor
  author: eft
  label:
    en_US: JSON Extract
    zh_Hans: JSON 提取
description:
  human:
    en_US: Extract the first parseable JSON string from text, typically LLM output
    zh_Hans: 从文本（通常是 LLM 的输出）中提取第一段可解析的 JSON 字符串
  llm: "Extract the first parseable JSON string from a text, typically the output of an LLM. Recognizes two shapes only: the whole text being JSON, or a Markdown ```json (or untagged) fenced code block, whose content is returned verbatim. Bare JSON embedded in prose is not extracted. Returns found and json_text, or found=false with error_type (invalid_input, no_json_found, internal_error). Pipe the extracted json string into the JSON Schema Validator."
parameters:
  - name: text
    type: string
    required: true
    label:
      en_US: Text
      zh_Hans: 文本
    human_description:
      en_US: Text containing JSON, typically the output of an LLM (only whole-text JSON, or JSON inside a Markdown code fence)
      zh_Hans: 包含 JSON 的文本，通常是 LLM 的输出（仅支持整体为 JSON，或 Markdown 代码围栏包裹的 JSON）
    llm_description: "The text to extract JSON from, typically an LLM answer. Only two shapes are recognized: the whole text being JSON, or a Markdown ```json (or untagged) fenced code block; prose around bare JSON is not handled."
    form: llm
output_schema:
  type: object
  properties:
    found:
      type: boolean
      description: Whether a parseable JSON string was extracted
    json_text:
      type: string
      description: The extracted JSON text, verbatim; present on success
    error_type:
      type: string
      description: Failure category; present on failure (invalid_input, no_json_found, internal_error)
    error_detail:
      type: string
      description: Human-readable failure detail; present on failure
extra:
  python:
    source: tools/json_extractor.py
