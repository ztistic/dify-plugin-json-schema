identity:
  name: json_extractor
  author: eft
  label:
    en_US: JSON Extract
    zh_Hans: JSON 提取
description:
  human:
    en_US: Extract the first parseable JSON string from text, typically LLM output
    zh_Hans: 从文本（通常是 LLM 的输出）中提取第一段可解析的 JSON 字符串
  llm: "Extract the first parseable JSON string from a text, typically the output of an LLM. Recognizes three shapes in order: the whole text being JSON, a Markdown ```json (or untagged) fenced code block, and the first JSON object or array embedded anywhere in the text. Every candidate must decode before it is accepted, and the embedded scan considers only object- and array-rooted values, so bare scalars in prose are not mistaken for JSON. Returns found and json_text, or found=false with error_type (invalid_input, no_json_found, internal_error). Pipe the extracted json string into the JSON Schema Validator."
parameters:
  - name: text
    type: string
    required: true
    label:
      en_US: Text
      zh_Hans: 文本
    human_description:
      en_US: Text containing JSON, typically the output of an LLM
      zh_Hans: 包含 JSON 的文本，通常是 LLM 的输出
    llm_description: "The text to extract JSON from, typically an LLM answer. Three shapes are recognized in order: the whole text being JSON, a Markdown ```json (or untagged) fenced code block, and the first JSON object or array embedded in the text."
    form: llm
output_schema:
  type: object
  properties:
    found:
      type: boolean
      description: Whether a parseable JSON string was extracted
    json_text:
      type: string
      description: The extracted JSON text, verbatim; present on success
    error_type:
      type: string
      description: Failure category; present on failure (invalid_input, no_json_found, internal_error)
    error_detail:
      type: string
      description: Human-readable failure detail; present on failure
extra:
  python:
    source: tools/json_extractor.py
