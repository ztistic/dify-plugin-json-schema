identity:
  name: json_extractor
  author: eft
  label:
    en_US: JSON Extract
    zh_Hans: JSON 提取
description:
  human:
    en_US: Extract the first parseable JSON string from text, typically LLM output
    zh_Hans: 从文本（通常是 LLM 的输出）中提取第一段可解析的 JSON 字符串
  llm: "Extract the first parseable JSON string from a text, typically raw LLM output. Tries in order: the whole text, a ```json or untagged fenced code block, and -- only when scan_embedded is true -- the first embedded JSON object or array. Decoding is strict (NaN/Infinity rejected) and the result is a verbatim slice. Returns found and json_text, or found=false with error_type (invalid_input, no_json_found, internal_error). Structure validation is the JSON Validate tool's job."
parameters:
  - name: text
    type: string
    required: true
    label:
      en_US: Text
      zh_Hans: 文本
    human_description:
      en_US: Text containing JSON, typically LLM output; only the first parseable JSON is extracted, its structure is not validated
      zh_Hans: 包含 JSON 的文本，通常是 LLM 的输出；仅提取第一段可解析的 JSON，不校验其结构
    llm_description: "The text to extract JSON from, typically a raw LLM answer. The whole text is tried first, then ```json or untagged fenced code blocks; embedded JSON is searched only when scan_embedded is true. Decoding is strict: NaN and Infinity are not accepted."
    form: llm
  - name: scan_embedded
    type: boolean
    required: false
    label:
      en_US: Scan embedded JSON
      zh_Hans: 扫描内嵌 JSON
    human_description:
      en_US: Off by default; only the boolean value true enables it. When on, the extractor also searches the text for the first JSON object or array, beyond whole-text JSON and code fences
      zh_Hans: 默认关闭，仅布尔值 true 生效。开启后除整体 JSON 与代码围栏外，还从文本中搜寻第一段 JSON 对象或数组
    llm_description: "Enable the third extraction shape: scan the text for the first JSON object or array embedded in surrounding prose. Read strictly -- only the boolean true enables it. Turn it on only when JSON is expected to be mixed into other text."
    form: llm
output_schema:
  type: object
  properties:
    found:
      type: boolean
      description: Whether a parseable JSON string was extracted
    json_text:
      type: string
      description: The extracted JSON text, verbatim; present on success
    error_type:
      type: string
      description: Failure category; present on failure (invalid_input, no_json_found, internal_error)
    error_detail:
      type: string
      description: Human-readable failure detail; present on failure
extra:
  python:
    source: tools/json_extractor.py
