identity:
  name: json_schema_validator
  author: eft
  label:
    en_US: JSON Validate
    zh_Hans: JSON 校验
description:
  human:
    en_US: Validate a JSON string against a JSON Schema and return a typed result
    zh_Hans: 校验 JSON 字符串是否符合指定的 JSON Schema，并返回带类型标记的结果
  llm: "Validate a JSON string against a JSON Schema. Returns is_valid, error_type, error_detail, json_path, absolute_path and absolute_schema_path. error_type is one of: invalid_input, invalid_json, invalid_schema_json, schema_error, unsupported_draft, ref_resolution_error, internal_error, validation_failed. Use this as a quality gate after an LLM node before consuming structured output downstream."
parameters:
  - name: json_input
    type: string
    required: true
    label:
      en_US: JSON Input
      zh_Hans: JSON 数据
    human_description:
      en_US: The JSON string to validate (only text that is itself valid JSON; Markdown code fences and other wrappers are not stripped)
      zh_Hans: 需要校验的 JSON 字符串（仅接受本身即为合法 JSON 的文本，不处理 Markdown 代码围栏等包装）
    llm_description: The JSON data string to be validated. Must be raw, parseable JSON -- the tool does not strip Markdown code fences or other wrappers, so run the JSON Extractor tool first if the source is an LLM answer.
    form: llm
  - name: schema_input
    type: string
    required: true
    label:
      en_US: JSON Schema
      zh_Hans: JSON Schema
    human_description:
      en_US: The JSON Schema used to validate the input
      zh_Hans: 用于校验输入的 JSON Schema
    llm_description: "The JSON Schema definition string. Draft 2020-12, 2019-09, 07, 06 and 04 are supported. Only inline $ref pointers can be resolved. The schema is applied exactly as written -- to reject undeclared properties, declare additionalProperties: false yourself."
    form: llm
output_schema:
  type: object
  properties:
    is_valid:
      type: boolean
      description: Whether the input satisfies the schema
    error_type:
      type: string
      description: Failure category; present on failure (invalid_input, invalid_json, invalid_schema_json, schema_error, unsupported_draft, ref_resolution_error, validation_failed, internal_error)
    error_detail:
      type: string
      description: Human-readable failure detail; present on failure
    json_path:
      type: string
      description: 'Location in the JSON that failed as a JSONPath string, e.g. "$.tags[1]" or "$[''a b'']"; present on failure, empty when not applicable'
    absolute_path:
      type: array
      description: 'Location in the JSON that failed as raw path segments, e.g. ["tags", 1]; present on failure, empty when not applicable'
      items: {}
    absolute_schema_path:
      type: array
      description: 'Location in the schema of the violated keyword as raw path segments, e.g. ["properties", "age", "minimum"]; present on failure, empty when not applicable'
      items: {}
extra:
  python:
    source: tools/json_schema_validator.py
