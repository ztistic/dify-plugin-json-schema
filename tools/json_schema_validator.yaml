identity:
  name: json_schema_validator
  author: eft
  label:
    en_US: JSON Validate
    zh_Hans: JSON 校验
description:
  human:
    en_US: Validate a JSON string against a JSON Schema (drafts 2020-12 / 2019-09 / 07 / 06 / 04) and return a typed result
    zh_Hans: 依据 JSON Schema（支持 2020-12 / 2019-09 / 07 / 06 / 04 草案）校验 JSON 字符串，返回带类型标记的结果
  llm: "Validate a JSON string against a JSON Schema. Both inputs must be raw JSON text: nothing is stripped, and NaN/Infinity are rejected. Drafts 2020-12/2019-09/07/06/04 via $schema (default 2020-12); boolean schemas accepted; only inline $ref resolves. Returns is_valid=true, or is_valid=false with error_type (invalid_input, invalid_json, invalid_schema_json, schema_error, unsupported_draft, ref_resolution_error, validation_failed, internal_error), error_detail, json_path, absolute_path and absolute_schema_path. Typical use: quality gate on the JSON Extract tool's json_text output."
parameters:
  - name: json_input
    type: string
    required: true
    label:
      en_US: JSON Input
      zh_Hans: JSON 数据
    human_description:
      en_US: The JSON string to validate; it must itself be valid JSON -- Markdown code fences and other wrappers are not stripped, and the non-standard constants NaN and Infinity are rejected
      zh_Hans: 需要校验的 JSON 字符串；其本身必须是合法 JSON——不会剥离 Markdown 代码围栏等包装，NaN、Infinity 等非标准常量会被拒绝
    llm_description: "The JSON data string to validate. Must be raw, strictly parseable JSON: Markdown fences and other wrappers are not stripped, and the non-standard constants NaN and Infinity are rejected. For raw LLM answers, extract the JSON first with the JSON Extract tool."
    form: llm
  - name: schema_input
    type: string
    required: true
    label:
      en_US: JSON Schema
      zh_Hans: JSON Schema
    human_description:
      en_US: The JSON Schema to validate against (drafts 2020-12 / 2019-09 / 07 / 06 / 04; only inline $ref pointers resolve)
      zh_Hans: 用于校验的 JSON Schema（支持 2020-12 / 2019-09 / 07 / 06 / 04 草案，仅可解析文档内联 $ref 指针）
    llm_description: "The JSON Schema string. The draft is selected from its $schema declaration (2020-12, 2019-09, 07, 06, 04; default 2020-12); a boolean schema is accepted; only inline $ref pointers resolve. The schema is applied exactly as written -- undeclared object properties are allowed unless the schema sets additionalProperties: false."
    form: llm
output_schema:
  type: object
  properties:
    is_valid:
      type: boolean
      description: Whether the input satisfies the schema
    error_type:
      type: string
      description: Failure category; present on failure (invalid_input, invalid_json, invalid_schema_json, schema_error, unsupported_draft, ref_resolution_error, validation_failed, internal_error)
    error_detail:
      type: string
      description: Human-readable failure detail; present on failure
    json_path:
      type: string
      description: 'Location in the JSON that failed as a JSONPath string, e.g. "$.tags[1]" or "$[''a b'']"; present on failure, empty when not applicable'
    absolute_path:
      type: array
      description: 'Location in the JSON that failed as raw path segments, e.g. ["tags", 1]; present on failure, empty when not applicable'
      items: {}
    absolute_schema_path:
      type: array
      description: 'Location in the schema of the violated keyword as raw path segments, e.g. ["properties", "age", "minimum"]; present on failure, empty when not applicable'
      items: {}
extra:
  python:
    source: tools/json_schema_validator.py
